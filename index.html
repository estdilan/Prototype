<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockey</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="arcade-background"></div>
<canvas id="renderCanvas" tabindex="0"></canvas>
<div id="error-box"></div>

<!-- Loading overlay -->
<div id="loading" class="panel">
  <div id="loading-text" class="ui-text">INICIANDO...</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<!-- Start screen -->
<div id="start-screen" class="panel">
  <!-- Las secciones se alinean directamente en el centro del panel -->
  <section id="welcome-screen" class="screen-section active">
    <div class="title-block">
      <h1 id="start-title" class="title-hero" aria-label="ROCKEY">
        <span class="title-letter">R</span>
        <span class="title-letter">O</span>
        <span class="title-letter">C</span>
        <span class="title-letter">K</span>
        <span class="title-letter">E</span>
        <span class="title-letter">Y</span>
      </h1>
    </div>
    <button id="welcome-start-btn" class="btn-primary btn-start">START</button>
  </section>

  <section id="calibration-screen" class="screen-section">
    <div class="calibration-panel">
      <p class="ui-text dimmed" id="calibration-eyebrow">Configurando tus comandos de voz...</p>
      <h2 class="display-text" id="calibration-title">Di las palabras en voz alta:</h2>

      <ul id="calibration-list" class="calibration-list">
        <li class="calibration-item" data-color="rojo">
          <span class="marker"></span>
          <span class="word">ROJO</span>
        </li>
        <li class="calibration-item" data-color="azul">
          <span class="marker"></span>
          <span class="word">AZUL</span>
        </li>
        <li class="calibration-item" data-color="verde">
          <span class="marker"></span>
          <span class="word">VERDE</span>
        </li>
        <li class="calibration-item" data-color="amarillo">
          <span class="marker"></span>
          <span class="word">AMARILLO</span>
        </li>
      </ul>

      <div id="calibration-visualizer" class="calibration-visualizer">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div id="calibration-status" class="ui-text">Escuchando...</div>
      <div id="calibration-ready">TODO LISTO!</div>
      <button id="start-btn" class="btn-primary btn-start blink">COMENZAR JUEGO</button>
    </div>
  </section>
</div>

<!-- HUD Elements -->
<div id="hud-container">
  <div id="hud-top-left">
    <div id="score-card" class="hud-panel">
      <div class="hud-label">PELLETS</div>
      <div class="hud-value">
        <span class="hud-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="6" fill="currentColor" />
          </svg>
        </span>
        <div id="score">000</div>
      </div>
    </div>
  </div>

  <div id="hud-top-right">
    <div id="timer-card" class="hud-panel">
      <div class="hud-label">TIEMPO</div>
      <div class="hud-value">
        <span class="hud-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="12" x2="15" y2="14" />
          </svg>
        </span>
        <div id="timer">00:00</div>
      </div>
    </div>
  </div>
</div>

<!-- Barra de progreso de spawn -->
<div id="spawn-progress"><div id="spawn-progress-fill"></div></div>

<!-- Microphone Error / Advice -->
<div id="mic-feedback-panel" class="hud-panel error-state" style="display: none;">
  <span id="mic-error"></span>
  <button id="mic-fix-btn" class="btn-secondary btn-small">Intentar Reconectar</button>
</div>

<!-- Victory -->
<div id="victory" class="panel">
  <p id="victory-label" class="ui-text highlight">NIVEL COMPLETADO</p>
  <div id="victory-score" class="display-text">0</div>
  <button id="victory-restart" class="btn-primary">VOLVER A EMPEZAR</button>
</div>

<!-- Game Over -->
<div id="game-over" class="panel">
  <p id="game-over-label" class="ui-text warning">TIEMPO AGOTADO</p>
  <div id="game-over-score" class="display-text">0</div>
  <p id="game-over-sub" class="ui-text dimmed">PELLETS COMPLETADOS</p>
  
  <div class="stats-row" id="game-over-stats">
    <div class="stat"><span class="stat-label">Racha Máxima</span><span id="stat-streak" class="stat-val">0</span></div>
  </div>

  <div class="button-group">
    <button id="game-over-restart" class="btn-primary">INTENTAR DE NUEVO</button>
  </div>
</div>

<!-- Microphone indicator -->
<div id="mic-wrap">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" id="mic-svg">
    <rect x="9" y="2" width="6" height="12" rx="3" fill="#888"/>
    <path d="M5 11a7 7 0 0 0 14 0" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="#888" stroke-width="2" stroke-linecap="round"/>
    <line x1="8"  y1="22" x2="16" y2="22" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  </svg>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
